[workspace]
resolver = "2"
members = [
  "crates/habit-core",
  "crates/habit-sensors",
  "crates/habit-mapper",
  "crates/habit-snooze",
  "crates/habit-cli",
  "plugins/rust/sensors",
]

[workspace.package]
version = "1.5.0"
edition = "2021"
authors = ["Habit Hooks Authors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
minijinja = { version = "2.7", features = ["loader"] }
chrono = { version = "0.4", features = ["serde"] }
sha1 = "0.10"
glob = "0.3"
pathdiff = "0.2"
walkdir = "2.5"
syn = { version = "2.0", features = ["full", "visit", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
tempfile = "3.16"
regex = "1.11"
pretty_assertions = "1.4"
