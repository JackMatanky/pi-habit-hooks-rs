[workspace]
resolver = "2"
members = [
  "crates/habit-core",
  "crates/habit-sensors",
  "crates/habit-mapper",
  "crates/habit-snooze",
  "crates/habit-cli",
  "plugins/rust/sensors",
]

[workspace.package]
version = "1.5.0"
edition = "2021"
authors = ["Habit Hooks Authors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
thiserror = "2.0.21"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
minijinja = { version = "3.0.3", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
sha1 = "0.11.0"
glob = "0.3.4"
pathdiff = "0.2.3"
walkdir = "2.5.0"
syn = { version = "3.0.9", features = ["full", "visit", "extra-traits"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
tempfile = "3.27.0"
regex = "1.13.1"
pretty_assertions = "1.4.1"
