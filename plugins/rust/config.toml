language = "rust"
files = [
  "**/*.rs",
  "!**/target/**/*.rs"
]

sensors = [
  { name = "messrust", tool = "messrust", args = ["${files:comma}", "json", "codesize,design", "--ignore-tests"], success_exit_codes = [0, 2], transform = "messrust.jq" },
  { name = "clippy", tool = "${dir}/sensors/clippy_sensor", args = ["--target-dir", ".habit-hooks/target", "--files", "${files}"], success_exit_codes = [0, 1], transform = "clippy.jq" },
  { name = "modules", tool = "${dir}/sensors/modules_sensor", args = ["${files}"], success_exit_codes = [0, 1], transform = "modules.jq" },
  { name = "deps", tool = "${dir}/sensors/deps_sensor", args = ["${files}"], success_exit_codes = [0, 1], transform = "deps.jq" },
  { name = "comment", tool = "${dir}/sensors/comment_sensor", args = ["${files}"], success_exit_codes = [0], transform = "comment.jq" }
]

detectors = [
  { name = "messrust", kind = "command", install = "cargo install messrust" },
  { name = "clippy", kind = "command", install = "rustup component add clippy" },
  { name = "cargo-modules", kind = "command", install = "cargo install cargo-modules" },
  { name = "cargo-machete", kind = "command", install = "cargo install cargo-machete" },
  { name = "cargo", kind = "command", install = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh" }
]
